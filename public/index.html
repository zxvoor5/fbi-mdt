<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مركز العمليات الميدانية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07080b;--p:#0e1016;--p2:#13151d;--bd:#222633;--tx:#e9eaf0;--mu:#8b8fa0;--rd:#d4162c;--rd2:#ff4559;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Tajawal,Tahoma,sans-serif;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:32px 32px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#0a0b10;border:1px solid var(--bd);border-radius:4px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--rd2);outline-offset:1px}
textarea{width:100%;min-height:80px}
.b{background:var(--rd);border:0;border-radius:4px;padding:8px 16px;cursor:pointer;font-weight:700;box-shadow:0 0 14px #d4162c55}
.g{background:none;border:1px solid var(--bd);border-radius:4px;padding:8px 14px;cursor:pointer}
.ib{background:none;border:0;cursor:pointer;color:var(--mu);font-size:16px}.ib:hover{color:var(--rd2)}
.shell{display:flex;min-height:100vh}
aside{width:240px;flex:none;background:var(--p);border-inline-end:1px solid var(--bd);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:16px;border-bottom:1px solid var(--bd)}
.brand b{display:block;line-height:1.3}.brand small{color:var(--rd2);font-size:11px}
nav{flex:1;overflow:auto;padding:8px}
nav a{display:flex;gap:10px;padding:9px 12px;border-radius:4px;color:var(--mu);cursor:pointer;border:1px solid transparent}
nav a:hover{color:var(--tx)}nav a.on{background:#2a1316;color:var(--rd2);border-color:#5a1a22}
.foot{padding:12px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}
main{flex:1;padding:28px;min-width:0}
.hd{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--bd);margin-bottom:22px}
.hi{width:40px;height:40px;display:grid;place-items:center;border:1px solid #5a1a22;background:#2a1316;color:var(--rd2);border-radius:4px;box-shadow:0 0 14px #d4162c44}
.hd h1{margin:0;font-size:28px;font-weight:500;line-height:1.2}.bc{font-size:11px;color:var(--rd2)}.sp{flex:1}
.panel,.card,.tw,.empty{background:var(--p);border:1px solid var(--bd);border-radius:4px}
.panel{padding:20px;margin-bottom:16px}.empty{padding:36px;text-align:center;color:var(--mu)}
.dg{display:grid;grid-template-columns:1fr 380px;gap:20px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.st div{background:var(--p2);border:1px solid var(--bd);padding:12px 16px}.st small{color:var(--mu);font-size:12px}.st b{display:block;font-size:34px;line-height:1.2}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 12px}.bar i{height:6px;background:var(--bd)}.bar i.f{background:var(--rd);box-shadow:0 0 8px var(--rd)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tiles a{background:var(--p);border:1px solid var(--bd);padding:30px 10px;text-align:center;cursor:pointer;font-weight:500}.tiles a:hover{border-color:var(--rd)}.tiles span{display:block;font-size:30px;color:var(--rd2)}
.mapbox{border:1px solid var(--rd);box-shadow:0 0 24px #d4162c55;align-self:start;background:#04100f}.mapbox svg{display:block;width:100%;height:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ph{height:150px;display:grid;place-items:center;font-size:48px;color:var(--rd);background:linear-gradient(#1c1013,var(--p))}
.cb{padding:14px}.cb h3{margin:6px 0 2px}.cb p{margin:0;color:var(--mu);font-size:14px}.rw{display:flex;gap:10px;align-items:center;justify-content:space-between}.act{margin-top:10px}
.tag{border:1px solid #5a1a22;color:var(--rd2);font-size:11px;padding:0 8px;border-radius:3px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.chip{background:var(--p);border:1px solid var(--bd);padding:4px 14px;font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}.d0{background:#22a45d}.d1{background:var(--rd)}.d2{background:#e0a82e}.d3{background:#777}
.tw{overflow-x:auto;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--bd)}th{font-size:12px;color:var(--mu);font-weight:500}td input{width:100%}
.form{display:flex;gap:10px;flex-wrap:wrap}.form input{flex:1;min-width:120px}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;margin-top:16px;overflow-x:auto}
.day{background:var(--p);border:1px solid var(--bd);min-height:150px;padding:8px}.day h4{margin:0 0 8px;color:var(--rd2);font-weight:500;border-bottom:1px solid var(--bd);padding-bottom:4px}
.ev{background:var(--p2);border-inline-start:2px solid var(--rd);padding:4px 8px;margin-bottom:6px;font-size:13px}.ev small{color:var(--mu);display:block}
.rk{display:flex;gap:8px;align-items:center;background:var(--p);border:1px solid var(--bd);border-inline-start-width:3px;padding:8px;margin:0 auto 10px;max-width:760px}.rk input[type=text]{flex:1}.rk input[type=number]{width:60px}.rk input[type=color]{width:44px;padding:2px;height:36px}
.mo{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px}
.md{background:var(--p);border:1px solid var(--bd);padding:20px;width:min(440px,100%);max-height:90vh;overflow:auto}.md label{display:block;margin:10px 0 4px;color:var(--mu);font-size:13px}.md input,.md select{width:100%}.md .rw{margin-top:16px;justify-content:flex-start}
.login{min-height:100vh;display:grid;place-items:center}.lc{width:min(380px,92vw);background:var(--p);border:1px solid var(--bd);padding:32px;text-align:center;box-shadow:0 0 40px #d4162c33}
.lc input{width:100%;margin-top:10px}.lc .b{width:100%;margin-top:12px;padding:10px}.err{color:var(--rd2);min-height:22px;font-size:13px}
.cm{display:grid;grid-template-columns:200px 1fr;gap:14px}.chs{background:var(--p);border:1px solid var(--bd);padding:8px}.chs a{display:block;padding:7px 10px;cursor:pointer;color:var(--mu);font-size:14px}.chs a.on{background:#2a1316;color:var(--rd2)}
.msgs{height:55vh;overflow:auto;padding:14px}.msgs p{margin:0 0 10px}.msgs small{color:var(--mu)}
.ac{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--p);border:1px solid var(--bd);padding:12px 16px;margin-bottom:10px}.ac b{min-width:110px}.ac label{font-size:13px;color:var(--mu);display:flex;gap:4px;align-items:center}
.rad{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:20px}
@media(max-width:860px){.shell{flex-direction:column}aside{width:auto;height:auto;position:static}nav{display:flex;overflow-x:auto}nav a{white-space:nowrap}.dg,.rad,.cm{grid-template-columns:1fr}main{padding:16px}.tiles{grid-template-columns:repeat(2,1fr)}.st{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){animateTransform{display:none}}
</style></head><body><div id="app"></div>
<script>
const KEY='field_hub_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null;
S=S||{org:'مركز العمليات الميدانية',users:[],threat:2,note:'القطاع يعمل. مراقبة النشاط في المناطق الثلاث مستمرة.',people:[],sched:[],pins:[],msgs:[],
ranks:[['Director','المدير',10,'#d4162c'],['Deputy Director','نائب المدير',9,'#e0a82e'],['Special Agent in Charge','العميل الخاص المسؤول',7,'#3b82f6'],['Senior Special Agent','عميل خاص أول',5,'#22a45d'],['Special Agent','عميل خاص',3,'#9aa0ae'],['Cadet','متدرب',1,'#6b7280']].map(r=>({en:r[0],ar:r[1],l:r[2],c:r[3]})),
rec:{suspects:[],legal:[],operations:[],classified:[],evidence:[{t:'فوارغ طلقات - الموقع الأول',d:'تم العثور على فوارغ رصاص في مكان الحادث.',tag:'سري',st:'مفتوح'}],circulars:[{t:'التوجيه 01-2026',d:'يجب على جميع الموظفين تسجيل الحضور في بداية نوبتهم.',tag:'داخلي',st:'نشط'}]}};
const save=()=>queueSync();
let me=null,ME=null;
let page='dashboard',ch='جميع القنوات';
const REC={suspects:['المشتبه بهم','☹'],evidence:['دليل','✦'],legal:['الشؤون القانونية','⚖'],operations:['العمليات','◎'],circulars:['التعاميم الرسمية','☰'],classified:['ملفات مصنفة','🔒']};
const P=[['dashboard','مركز القيادة','▦'],['roster','قائمة الحضور','☺'],['schedule','جدول','▤'],['ranks','التسلسل الهرمي للرتب','★'],['suspects',...REC.suspects],['evidence',...REC.evidence],['legal',...REC.legal],['operations',...REC.operations],['circulars',...REC.circulars],['classified',...REC.classified],['radar','رادار','◉'],['comms','مركز الاتصالات','☏'],['admin','الإدارة','⚙']];
const U=()=>ME;
const can=id=>{const u=U();return u&&(id=='dashboard'||u.full||(id!='admin'&&u.perms.includes(id)))};
const emblem='<svg viewBox="0 0 40 40" width="40" height="40"><path d="M20 2l15 5v11c0 9-6 16-15 20C11 34 5 27 5 18V7z" fill="none" stroke="#d4162c" stroke-width="2"/><path d="M20 11l2.6 5.4 5.9.8-4.3 4.1 1 5.9L20 24.4l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="#d4162c"/></svg>';
function go(p){page=p;render()}
function login(){const a=S.users.find(x=>x.u===$('#lu').value.trim()&&x.p===$('#lp').value);if(!a){$('#le').textContent='اسم المستخدم أو كلمة المرور غير صحيحة';return}me=a.u;try{sessionStorage.setItem('fh_me',me)}catch(e){}page='dashboard';render()}
function logout(){me=null;try{sessionStorage.removeItem('fh_me')}catch(e){}render()}
function up(a,i,k,v,r){S[a][i][k]=v;save();if(r)render()}
function del(a,i){S[a].splice(i,1);save();render()}
function hd(t,ic,btn){return`<div class="hd"><div class="hi">${ic}</div><div><div class="bc">${esc(S.org)} // نظام سري</div><h1>${t}</h1></div><div class="sp"></div>${btn||''}</div>`}
function modal(title,fields,vals,cb){const m=document.createElement('div');m.className='mo';
m.innerHTML=`<div class="md"><h3 style="margin:0">${title}</h3>${fields.map(f=>`<label>${f.l}</label>${f.o?`<select name="${f.k}">${f.o.map(o=>`<option ${o==vals[f.k]?'selected':''}>${o}</option>`).join('')}</select>`:f.ta?`<textarea name="${f.k}">${esc(vals[f.k]||'')}</textarea>`:`<input name="${f.k}" value="${esc(vals[f.k]||'')}">`}`).join('')}<div class="rw"><button class="b" id="ok">حفظ</button><button class="g" id="no">إلغاء</button></div></div>`;
document.body.appendChild(m);m.querySelector('#no').onclick=()=>m.remove();
m.querySelector('#ok').onclick=()=>{const v={};m.querySelectorAll('[name]').forEach(e=>v[e.name]=e.value.trim());m.remove();cb(v)}}
function render(){const app=$('#app');
if(!U()){app.innerHTML=`<div class="login"><span class="g" style="position:fixed;top:16px;left:16px;font-size:12px;padding:2px 10px">العربية</span><div class="lc">${em()}<h2 style="margin:10px 0 2px">${esc(S.org)}</h2><p style="color:var(--mu);margin:0 0 14px">دخول مقيّد للموظفين المصرح لهم فقط</p><input id="lu" placeholder="اسم المستخدم" autocomplete="username"><input id="lp" type="password" placeholder="كلمة المرور" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"><div class="err" id="le"></div><button class="b" onclick="login()">تسجيل الدخول</button></div></div>`;return}
if(!can(page))page='dashboard';
const V={dashboard:dash,roster,schedule:sched,ranks,radar,comms,admin}[page];
app.innerHTML=`<div class="shell"><aside><div class="brand">${em()}<div><b>${esc(S.org)}</b><small>● عبر الإنترنت</small></div></div><nav>${P.filter(p=>can(p[0])).map(p=>`<a class="${p[0]==page?'on':''}" onclick="go('${p[0]}')"><span>${p[2]}</span>${p[1]}</a>`).join('')}</nav><div class="foot"><span>${esc(me)} · المشرف</span><button class="g" onclick="logout()">تسجيل الخروج</button></div></aside><main>${V?V():recView(page)}</main></div>`;
if(page=='radar')$('#rsv').onclick=pinClick}
/* dashboard */
const LV=['منخفض','متوسط','مرتفع','حرج','طوارئ'];
function dash(){const ops=S.rec.operations.filter(o=>o.st=='نشط').length,ag=S.people.filter(p=>p.s=='حاضر').length;
return hd('مركز القيادة','∿','<button class="g" onclick="editSector()">تحرير</button>')+`<div class="dg"><div><div class="panel"><b>حالة القطاع</b><div class="st"><div><small>مستوى التهديد</small><b style="color:var(--rd2)">${LV[S.threat]}</b></div><div><small>العمليات النشطة</small><b>${ops}</b></div><div><small>وكلاء في الخدمة</small><b>${ag}</b></div></div><div class="bar">${[0,1,2,3,4].map(i=>`<i class="${i<=S.threat?'f':''}"></i>`).join('')}</div><div style="color:var(--mu)">${esc(S.note)}</div></div><div class="tiles">${['suspects','evidence','legal','operations','circulars','classified'].filter(can).map(k=>`<a onclick="go('${k}')"><span>${REC[k][1]}</span>${REC[k][0]}</a>`).join('')}</div></div><div class="mapbox">${radarSVG(0)}</div></div>`}
function editSector(){modal('تحرير حالة القطاع',[{k:'th',l:'مستوى التهديد',o:LV},{k:'n',l:'ملاحظة',ta:1}],{th:LV[S.threat],n:S.note},v=>{S.threat=LV.indexOf(v.th);S.note=v.n;save();render()})}
/* records */
function recView(k){const L=S.rec[k];return hd(REC[k][0],REC[k][1],`<button class="b" onclick="recForm('${k}')">+ إضافة</button>`)+(L.length?`<div class="cards">${L.map((r,i)=>`<div class="card"><div class="ph">${REC[k][1]}</div><div class="cb"><div class="rw"><span class="tag">${esc(r.tag)}</span><small style="color:var(--mu)">${esc(r.st)}</small></div><h3>${esc(r.t)}</h3><p>${esc(r.d)}</p><div class="act"><button class="ib" title="تعديل" onclick="recForm('${k}',${i})">✎</button><button class="ib" title="حذف" onclick="if(confirm('حذف هذا الإدخال؟'))del2('${k}',${i})">🗑</button></div></div></div>`).join('')}</div>`:'<div class="empty">لا توجد إدخالات حتى الآن. اضغط «إضافة» لبدء السجل.</div>')}
function del2(k,i){S.rec[k].splice(i,1);save();render()}
function recForm(k,i){const e=i!=null;modal(e?'تعديل الإدخال':'إدخال جديد',[{k:'t',l:'العنوان'},{k:'d',l:'الوصف',ta:1},{k:'tag',l:'التصنيف',o:['سري','داخلي','عام']},{k:'st',l:'الحالة',o:['مفتوح','نشط','مغلق']}],e?S.rec[k][i]:{tag:'داخلي',st:'نشط'},v=>{if(!v.t)return;e?Object.assign(S.rec[k][i],v):S.rec[k].unshift(v);save();render()})}
/* roster */
const ST=['حاضر','غائب','متأخر','في إجازة'];
function roster(){const sel=(a,i,k,o,cur,r)=>`<select onchange="up('${a}',${i},'${k}',this.value,${r})">${o.map(x=>`<option ${x==cur?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
return hd('قائمة الحضور','☺')+`<div class="chips">${ST.map((s,i)=>`<span class="chip"><i class="dot d${i}"></i>${s} : ${S.people.filter(p=>p.s==s).length}</span>`).join('')}</div><div class="form"><input id="pn" placeholder="الاسم" onkeydown="if(event.key=='Enter')addP()"><button class="b" onclick="addP()">إضافة</button></div><div class="tw">${S.people.length?`<table><tr><th>#<th>الشارة<th>الاسم<th>الرتبة<th>الحالة<th>ملاحظات<th></tr>${S.people.map((p,i)=>`<tr><td>${i+1}<td>${p.b}<td>${esc(p.n)}<td>${sel('people',i,'r',S.ranks.map(r=>r.ar),p.r,0)}<td>${sel('people',i,'s',ST,p.s,1)}<td><input value="${esc(p.o)}" onchange="up('people',${i},'o',this.value)"><td><button class="ib" onclick="del('people',${i})">🗑</button></tr>`).join('')}</table>`:'<div class="empty">لا توجد إدخالات حتى الآن</div>'}</div>`}
function addP(){const n=$('#pn').value.trim();if(!n)return;S.people.push({n,b:1001+S.people.length,r:S.ranks.slice().sort((a,b)=>a.l-b.l)[0]?.ar||'',s:'حاضر',o:''});save();render()}
/* schedule */
const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
function sched(){return hd('جدول','▤')+`<div class="panel"><div class="form"><select id="sd">${DAYS.map(d=>`<option>${d}</option>`).join('')}</select><input id="sf" type="time" value="08:00" style="flex:0 0 120px"><input id="se" type="time" value="16:00" style="flex:0 0 120px"><input id="sx" placeholder="العنوان"><input id="sa" placeholder="مُسند إلى"><button class="b" onclick="addS()">إضافة</button></div></div><div class="week">${DAYS.map(d=>`<div class="day"><h4>${d}</h4>${S.sched.map((e,i)=>e.d==d?`<div class="ev"><b>${esc(e.x)}</b><small>${e.f} – ${e.e}${e.a?' · '+esc(e.a):''}</small><button class="ib" onclick="del('sched',${i})">✕</button></div>`:'').join('')}</div>`).join('')}</div>`}
function addS(){const x=$('#sx').value.trim();if(!x)return;S.sched.push({d:$('#sd').value,f:$('#sf').value,e:$('#se').value,x,a:$('#sa').value.trim()});save();render()}
/* ranks */
function ranks(){return hd('التسلسل الهرمي للرتب','★')+S.ranks.map((r,i)=>[r,i]).sort((a,b)=>b[0].l-a[0].l).map(([r,i])=>`<div class="rk" style="border-inline-start-color:${r.c}"><input type="text" dir="ltr" value="${esc(r.en)}" onchange="up('ranks',${i},'en',this.value)"><input type="text" value="${esc(r.ar)}" onchange="up('ranks',${i},'ar',this.value)"><input type="number" value="${r.l}" onchange="up('ranks',${i},'l',+this.value,1)"><input type="color" value="${r.c}" onchange="up('ranks',${i},'c',this.value,1)"><button class="ib" onclick="del('ranks',${i})">🗑</button></div>`).join('')+`<div class="rk"><input type="text" dir="ltr" id="rn" placeholder="الاسم (الإنجليزية)"><input type="text" id="ra" placeholder="الاسم (بالعربية)"><input type="number" id="rl" value="1"><input type="color" id="rc" value="#d4162c"><button class="b" onclick="addR()">إضافة</button></div>`}
function addR(){const ar=$('#ra').value.trim();if(!ar)return;S.ranks.push({en:$('#rn').value.trim(),ar,l:+$('#rl').value||1,c:$('#rc').value});save();render()}
/* radar */
function radarSVG(i){return`<svg id="${i?'rsv':'dsv'}" viewBox="0 0 400 560" style="${i?'cursor:crosshair':''}"><defs><radialGradient id="g" cx="50%" cy="50%"><stop offset="0" stop-color="#0d2a28"/><stop offset="1" stop-color="#04100f"/></radialGradient><linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4162c" stop-opacity="0"/><stop offset="1" stop-color="#d4162c" stop-opacity=".5"/></linearGradient></defs><rect width="400" height="560" fill="url(#g)"/>${[60,120,180,240].map(r=>`<circle cx="200" cy="280" r="${r}" fill="none" stroke="#d4162c" stroke-opacity=".15"/>`).join('')}<path d="M170 60C230 40 300 80 320 150c25 70 10 150 30 210 15 60-20 130-90 155-60 15-140-5-170-65-30-60 0-120-20-180-20-70 20-150 100-210z" fill="#18312e" stroke="#4d8a80" stroke-opacity=".5"/><path d="M215 170c40 0 70 20 62 50s-60 40-90 20 0-70 28-70z" fill="#04100f" stroke="#4d8a80" stroke-opacity=".4"/><path d="M110 400h150M130 440h130M170 380v100M220 380v110M90 330l90 40" stroke="#c9e6a0" stroke-opacity=".25" fill="none"/><g fill="#9fc9bd" font-size="12" text-anchor="middle"><text x="215" y="215">البحيرة</text><text x="190" y="440">الميناء</text><text x="170" y="110">المرتفعات</text><text x="290" y="320">الساحل</text></g>${S.map?`<image href="${S.map}" width="400" height="560" preserveAspectRatio="xMidYMid slice"/>`:''}<polygon points="200,280 200,-120 420,-60" fill="url(#sw)"><animateTransform attributeName="transform" type="rotate" from="0 200 280" to="360 200 280" dur="9s" repeatCount="indefinite"/></polygon>${S.pins.map(p=>`<g><circle cx="${p.x*4}" cy="${p.y*5.6}" r="6" fill="#ff4559"/><circle cx="${p.x*4}" cy="${p.y*5.6}" r="12" fill="none" stroke="#ff4559" stroke-opacity=".6"/><text x="${p.x*4+12}" y="${p.y*5.6+4}" fill="#fff" font-size="12">${esc(p.n)}</text></g>`).join('')}</svg>`}
function radar(){return hd('رادار','◉')+`<div class="rad"><div class="mapbox">${radarSVG(1)}<div style="padding:6px 10px;font-size:12px;color:var(--mu)">انقر على الخريطة لوضع علامة</div></div><div class="panel"><b>المواقع المرصودة</b>${S.pins.length?S.pins.map((p,i)=>`<div class="rw" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span>◉ ${esc(p.n)}</span><button class="ib" onclick="del('pins',${i})">🗑</button></div>`).join(''):'<p style="color:var(--mu)">لا توجد علامات بعد.</p>'}</div></div>`}
function pinClick(e){const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;modal('موقع جديد',[{k:'n',l:'اسم الموقع'}],{},v=>{if(!v.n)return;S.pins.push({n:v.n,x,y});save();render()})}
/* comms */
const CH=['جميع القنوات','المكتب','الشرطة','الدوريات','الإسعاف','العدل'];
function comms(){const L=S.msgs.filter(m=>ch=='جميع القنوات'||m.c==ch);return hd('مركز الاتصالات','☏')+`<div class="cm"><div class="chs">${CH.map(c=>`<a class="${c==ch?'on':''}" onclick="ch='${c}';render()"># ${c}</a>`).join('')}</div><div class="panel" style="padding:0;margin:0"><div class="msgs" id="ml">${L.length?L.map(m=>`<p><b>${esc(m.u)}</b> <small>#${esc(m.c)} · ${esc(m.t)}</small><br>${esc(m.x)}</p>`).join(''):'<span style="color:var(--mu)">لا توجد رسائل حتى الآن</span>'}</div><div class="form" style="padding:12px;border-top:1px solid var(--bd)"><select id="mc" style="flex:0 0 140px">${CH.slice(1).map(c=>`<option ${c==ch?'selected':''}>${c}</option>`).join('')}</select><input id="mx" placeholder="رسالة" onkeydown="if(event.key=='Enter')send()"><button class="b" onclick="send()">إرسال</button></div></div></div>`}
function send(){const x=$('#mx').value.trim();if(!x)return;S.msgs.push({u:me,c:$('#mc').value,x,t:new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})});save();render();const l=$('#ml');if(l)l.scrollTop=l.scrollHeight}
/* admin */
const PM=P.filter(p=>p[0]!='dashboard'&&p[0]!='admin');PM.push(['sector','تحرير حالة القطاع','']);
function admin(){return hd('الإدارة','⚙')+`<div class="panel"><b>الهوية والخريطة</b><p style="color:var(--mu);margin:6px 0">ارفع الشعار وصورة الخريطة الخاصة بك (تُحفظ في هذا المتصفح).</p><div class="form"><label>الاسم <input value="${esc(S.org)}" onchange="S.org=this.value;save();render()"></label><label>الشعار <input type="file" accept="image/*" onchange="setImg('logo',this)"></label><label>الخريطة <input type="file" accept="image/*" onchange="setImg('map',this)"></label><button class="g" onclick="S.logo='';S.map='';save();render()">إزالة الصور</button></div></div>`+`<div class="panel"><b>حساب جديد</b><div class="form" style="margin:10px 0"><input id="au" placeholder="اسم المستخدم"><input id="ap" placeholder="كلمة المرور"></div><label style="display:flex;gap:6px;color:var(--rd2)"><input type="checkbox" id="af">مسؤول كامل</label><div class="ac" style="border:0;padding:8px 0">${PM.map(p=>`<label><input type="checkbox" class="pc" value="${p[0]}">${p[1]}</label>`).join('')}</div><button class="b" onclick="addU()">إضافة</button></div><h3>حسابات المستخدمين</h3>`+S.users.map((u,i)=>`<div class="ac"><b>${esc(u.u)}</b><label style="color:var(--rd2)"><input type="checkbox" ${u.full?'checked':''} ${u.u==me?'disabled':''} onchange="uFull(${i},this.checked)">مسؤول كامل</label>${u.full?'':PM.map(p=>`<label><input type="checkbox" ${u.perms.includes(p[0])?'checked':''} onchange="tp(${i},'${p[0]}',this.checked)">${p[1]}</label>`).join('')}<span class="sp"></span><input id="pw${i}" placeholder="كلمة مرور جديدة (اختياري)"><button class="g" onclick="np(${i})">حفظ</button>${u.u==me?'':`<button class="ib" onclick="if(confirm('حذف الحساب؟'))uDel(${i})">🗑</button>`}</div>`).join('')}
function tp(i,id,on){const a=S.users[i].perms,k=a.indexOf(id);if(on&&k<0)a.push(id);if(!on&&k>=0)a.splice(k,1);save()}
function em(){return S.logo?`<img src="${S.logo}" width="40" height="40" alt="" style="object-fit:contain">`:emblem}
function setImg(k,i){const f=i.files[0];if(!f)return;if(f.size>1500000){alert('الصورة كبيرة، استخدم صورة أقل من 1.5 ميجابايت');return}const r=new FileReader();r.onload=()=>{S[k]=r.result;save();render()};r.readAsDataURL(f)}
function np(i){const v=$('#pw'+i).value;if(!v)return;S.users[i].p=v;save();alert('تم تحديث كلمة المرور')}
function addU(){const u=$('#au').value.trim(),p=$('#ap').value;if(!u||!p||S.users.some(x=>x.u==u)){alert('أدخل اسم مستخدم غير مكرر وكلمة مرور');return}S.users.push({u,p,full:$('#af').checked?1:0,perms:[...document.querySelectorAll('.pc:checked')].map(e=>e.value)});save();render()}
render();
</script>
<script>
/* طبقة الاتصال بالخادم: تستبدل التخزين المحلي بواجهة API */
$('#app').style.visibility='hidden';
const SK=['org','threat','note','logo','map','people','sched','ranks','pins',...Object.keys(REC).map(k=>'rec.'+k)];
const gv=k=>k.startsWith('rec.')?S.rec[k.slice(4)]:S[k];
let snap={},tm=0;
const takeSnap=()=>{snap={};SK.forEach(k=>snap[k]=JSON.stringify(gv(k)))};
async function api(m,u,b){
  try{
    const r=await fetch(u,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});
    let d={};try{d=await r.json()}catch(e){}
    if(r.status==401&&ME){ME=null;me=null;render()}
    return{ok:r.ok,status:r.status,data:d};
  }catch(e){return{ok:false,status:0,data:{error:'تعذّر الاتصال بالخادم'}}}
}
function queueSync(){clearTimeout(tm);tm=setTimeout(sync,300)}
async function flush(){clearTimeout(tm);await sync()}
async function sync(){
  if(!ME)return;
  const b={},ns={};
  SK.forEach(k=>{const j=JSON.stringify(gv(k));if(j!==snap[k]){b[k]=gv(k);ns[k]=j}});
  if(!Object.keys(b).length)return;
  const r=await api('PUT','/api/state',b);
  if(r.ok){Object.assign(snap,ns);if(r.data.rejected&&r.data.rejected.length){await load();render();alert('لا تملك صلاحية تعديل بعض البيانات')}}
  else{await load();render();if(r.data.error)alert(r.data.error)}
}
async function load(){
  const r=await api('GET','/api/state');if(!r.ok)return;
  const d=r.data;
  S.people=[];S.sched=[];S.ranks=[];S.pins=[];
  const rec=d.state.rec||{};delete d.state.rec;
  Object.assign(S,d.state);
  S.rec={};Object.keys(REC).forEach(k=>S.rec[k]=rec[k]||[]);
  S.msgs=d.msgs||[];S.users=[];
  if(ME&&ME.full)await refreshUsers();
  takeSnap();
}
async function loadMsgs(){const r=await api('GET','/api/msgs');if(r.ok)S.msgs=r.data}
async function refreshUsers(){const r=await api('GET','/api/users');if(r.ok)S.users=r.data}
async function boot(){
  const p=await api('GET','/api/public');
  if(p.ok){S.org=p.data.org;S.logo=p.data.logo||''}
  const m=await api('GET','/api/me');
  if(m.ok){ME=m.data;me=ME.u;await load()}
  render();$('#app').style.visibility='visible';
}
async function go(p){page=p;if(ME){await flush();await load()}render()}
async function login(){
  const r=await api('POST','/api/login',{u:$('#lu').value.trim(),p:$('#lp').value});
  if(!r.ok){$('#le').textContent=r.data.error||'تعذّر تسجيل الدخول';return}
  ME=r.data;me=ME.u;page='dashboard';await load();render();
}
async function logout(){await flush();await api('POST','/api/logout',{});location.reload()}
async function send(){
  const x=$('#mx').value.trim();if(!x)return;
  const r=await api('POST','/api/msgs',{c:$('#mc').value,x});
  if(!r.ok){alert(r.data.error||'تعذّر الإرسال');return}
  await loadMsgs();render();const l=$('#ml');if(l)l.scrollTop=l.scrollHeight;
}
function msgsHTML(){
  const L=S.msgs.filter(m=>ch=='جميع القنوات'||m.c==ch);
  return L.length?L.map(m=>`<p><b>${esc(m.u)}</b> <small>#${esc(m.c)} · ${esc(m.t)}</small><br>${esc(m.x)}</p>`).join(''):'<span style="color:var(--mu)">لا توجد رسائل حتى الآن</span>';
}
setInterval(async()=>{
  if(!ME||document.hidden||page!='comms')return;
  await loadMsgs();const l=$('#ml');if(!l)return;
  const atEnd=l.scrollTop+l.clientHeight>=l.scrollHeight-30;
  l.innerHTML=msgsHTML();if(atEnd)l.scrollTop=l.scrollHeight;
},4000);
/* إدارة الحسابات */
async function uPatch(u,b){const r=await api('PATCH','/api/users/'+encodeURIComponent(u),b);if(!r.ok)alert(r.data.error||'تعذّر الحفظ');return r}
function tp(i,id,on){const a=S.users[i].perms,k=a.indexOf(id);if(on&&k<0)a.push(id);if(!on&&k>=0)a.splice(k,1);uPatch(S.users[i].u,{perms:a})}
async function uFull(i,on){await uPatch(S.users[i].u,{full:on?1:0});await refreshUsers();render()}
async function np(i){const v=$('#pw'+i).value;if(!v)return;const r=await uPatch(S.users[i].u,{p:v});if(r.ok)alert('تم تحديث كلمة المرور')}
async function uDel(i){const r=await api('DELETE','/api/users/'+encodeURIComponent(S.users[i].u));if(!r.ok)alert(r.data.error||'تعذّر الحذف');await refreshUsers();render()}
async function addU(){
  const r=await api('POST','/api/users',{u:$('#au').value.trim(),p:$('#ap').value,full:$('#af').checked?1:0,perms:[...document.querySelectorAll('.pc:checked')].map(e=>e.value)});
  if(!r.ok){alert(r.data.error||'تعذّر إنشاء الحساب');return}
  await refreshUsers();render();
}
boot();
</script></body></html>
